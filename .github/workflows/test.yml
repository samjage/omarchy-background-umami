name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest # Omarchy is Arch, so test where it runs
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: pacman -Syu --noconfirm --needed jq perl diffutils shellcheck
      - name: Lint
        run: shellcheck -x -P lib bin/* libexec/* lib/*.sh test/run
      - name: Test
        run: test/run
